trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "20.x"
  azureServiceConnection: "AZURE_SERVICE_CONNECTION"
  webAppName: "AZURE_WEBAPP_NAME"
  artifactName: "webapp-package"

stages:
  - stage: CI
    displayName: CI
    jobs:
      - job: Build
        displayName: Build standalone package
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Install dependencies

          - script: npm run build
            displayName: Build Next.js standalone app

          - task: ArchiveFiles@2
            displayName: Archive standalone package
            inputs:
              rootFolderOrFile: "$(Build.SourcesDirectory)/.next/standalone"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(artifactName).zip"
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: Publish deployment artifact
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/$(artifactName).zip"
              ArtifactName: $(artifactName)
              publishLocation: Container

  - stage: CD
    displayName: CD
    dependsOn: CI
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Deploy to Azure Web App
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(artifactName)

                - task: AzureWebApp@1
                  displayName: Deploy to Azure Web App Linux
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(webAppName)
                    runtimeStack: "NODE|20-lts"
                    package: "$(Pipeline.Workspace)/$(artifactName)/$(artifactName).zip"
                    startUpCommand: "node server.js"
